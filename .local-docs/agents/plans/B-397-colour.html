<title>Fusion Colour Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Lora:wght@500;600&display=swap">
<style>
/* Full-size 1440 frames scaled to the column; three takes per theme on the agreed palette, lightness only. */
:root {
  --bg: #0d0d10; --fg: #ececef; --muted: #9d9da6; --line: #2a2a30; --chip: #1c1c21; --accent: #f5c400; --accent-ink: #1b1600; --focus: #7aa7ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f1f1f3; --fg: #18181b; --muted: #5d5d66; --line: #dcdce1; --chip: #ffffff; --accent: #f2c200; --accent-ink: #1b1600; --focus: #2f6fdb; color-scheme: light; } }
:root[data-theme="light"] { --bg: #f1f1f3; --fg: #18181b; --muted: #5d5d66; --line: #dcdce1; --chip: #ffffff; --accent: #f2c200; --accent-ink: #1b1600; --focus: #2f6fdb; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Geist", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.bar h1 { font-family: "Lora", Georgia, serif; font-weight: 600; font-size: 19px; margin: 0 8px 0 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); font-weight: 600; }
.grow { flex: 1; }
.picked { font-size: 13px; color: var(--muted); }
.picked b { color: var(--fg); }
.saved { font-size: 12px; color: var(--muted); }
.copy { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
main { max-width: 1240px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.take { display: grid; gap: 10px; }
.take-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.take-head .name { font-weight: 600; font-size: 16px; }
.pick { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.star { color: var(--accent); font-size: 13px; }
.stage { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.stage.on { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.scale { width: 1440px; transform-origin: 0 0; }
textarea { width: 100%; min-height: 60px; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font: inherit; font-size: 14px; resize: vertical; }
.copybox { display: grid; gap: 8px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.on { opacity: 1; }

/* ---- the Fusion frame, 1440 × 900, coloured from --k-* set per take ---- */
.f { width: 1440px; height: 900px; display: flex; background: var(--k-page); color: var(--k-fg); font-family: "Geist", system-ui, sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden; }
.f .sb { width: 248px; flex: none; background: var(--k-sb); padding: 18px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset -1px 0 0 var(--k-hl); }
.f .co { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 600; }
.f .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--k-pr); color: var(--k-pri); display: grid; place-items: center; font-weight: 700; }
.f .ni { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; color: var(--k-mu); font-size: 13.5px; }
.f .ni.on { background: var(--k-in); color: var(--k-fg); font-weight: 600; }
.f .ni.g { color: var(--k-fg); font-weight: 600; margin-top: 10px; }
.f .ni.s { padding-left: 34px; }
.f .ic2 { width: 18px; height: 18px; flex: none; }
.f .ic { width: 16px; height: 16px; border-radius: 5px; border: 1.6px solid currentColor; opacity: 0.8; flex: none; }
.f .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.f .top { height: 60px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 28px; }
.f .search { width: 360px; height: 36px; border-radius: 12px; background: var(--k-in); color: var(--k-mu); display: flex; align-items: center; padding: 0 14px; font-size: 13px; }
.f .bd { flex: 1; min-height: 0; padding: 4px 28px 28px; display: flex; flex-direction: column; gap: 20px; }
.f .av { border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 600; flex: none; }
.f .band { background: var(--k-band); border-radius: 28px; padding: 30px 32px 0; display: flex; flex-direction: column; gap: 22px; box-shadow: var(--k-bandb); }
.f .ser { font-family: "Lora", Georgia, serif; font-weight: 500; letter-spacing: -0.015em; }
.f .mu { color: var(--k-mu); }
.f .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.f .tabs { display: flex; gap: 28px; font-size: 14px; color: var(--k-mu); }
.f .tabs span { padding-bottom: 14px; }
.f .tabs .on { color: var(--k-fg); font-weight: 600; box-shadow: inset 0 -2.5px 0 var(--k-pr); }
.f .cols { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; min-height: 0; }
.f .rail { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; font-size: 13.5px; }
.f .rail .lab { font-size: 12px; color: var(--k-mu); }
.f .card { background: var(--k-card); border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--k-cardb); }
.f .ct { font-family: "Lora", Georgia, serif; font-weight: 600; font-size: 17px; }
.f .inl { background: var(--k-in); border-radius: 14px; padding: 12px 14px; }
.f .g2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
.f .barx { height: 6px; border-radius: 4px; background: var(--k-gh); overflow: hidden; }
.f .barx i { display: block; height: 100%; border-radius: 4px; background: var(--k-pr); }
.f .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--k-in); white-space: nowrap; }
.f .chip.ok { background: var(--k-oks); color: var(--k-ok); }
.f .chip.wa { background: var(--k-was); color: var(--k-wa); }
.f .btn { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; background: var(--k-card); box-shadow: inset 0 0 0 1px var(--k-hl); }
.f .btn.pr { background: var(--k-pr); color: var(--k-pri); box-shadow: none; }
.f table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.f th { text-align: left; font-weight: 500; color: var(--k-mu); font-size: 12.5px; padding: 12px 16px; }
.f td { padding: 11px 16px; border-top: 1px solid var(--k-hl); white-space: nowrap; }
.f .stack .av { box-shadow: 0 0 0 2px var(--k-band); margin-left: -8px; }
.f .stack .av:first-child { margin-left: 0; }
.f .tl { display: flex; gap: 12px; align-items: flex-start; }
.f .tl .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--k-pr); margin-top: 5px; flex: none; }
.f .tl .dot.off { background: var(--k-gh); }
.f .quote { font-family: "Lora", Georgia, serif; font-size: 15.5px; line-height: 1.55; }
</style>
<div class="bar" role="region" aria-label="Controls">
  <div class="bar-in">
    <h1>Colour</h1>
    <span class="seg" role="group" aria-label="Theme"><button type="button" data-th="dark" aria-pressed="true">Dark</button><button type="button" data-th="light" aria-pressed="false">Light</button></span>
    <span class="seg" role="group" aria-label="Page"><button type="button" data-pg="person" aria-pressed="true">Aicha's page</button><button type="button" data-pg="people" aria-pressed="false">People</button></span>

</main>

<script>
// The agreed palette (zinc neutrals, hue 286, the yellow brand); only lightness moves between takes.
const o = (l, c = 0.004, h = 286, a) => `oklch(${l} ${c} ${h}${a ? " / " + a : ""})`;
const TAKES = {
  dark: [
    ["a", "As today", { page: 0.141, band: 0.175, card: 0.21, in: 0.235, sb: 0.16 }],

  ],

    ["c", "As today", { page: 0.955, band: 0.977, card: 1, in: 0.967, sb: 0.985 }],
  ],
};
const REC = { dark: "b", light: "a" };

    wa: L ? o(0.5, 0.12, 70) : o(0.8, 0.17, 86), was: L ? o(0.85, 0.19, 92, 0.3) : o(0.8, 0.18, 86, 0.16),

    cardb: t.lift ? "0 1px 2px oklch(0 0 0 / 0.05), 0 4px 14px oklch(0 0 0 / 0.05)" : "none",

  return Object.entries(v).map(([k, x]) => `--k-${k}:${x}`).join(";");
}

const topBar = `<div class="top"><span class="search">Search people, units, objectives</span><span style="flex:1"></span>${av("AK", 32)}</div>`;

function personPage() {
  return `${side("People")}<div class="main">${topBar}<div class="bd">
  <div class="band">
    <div class="row" style="gap:26px">${av("AB", 112)}
      <div style="display:grid;gap:6px"><span class="ser" style="font-size:36px;line-height:1.1">Aicha Bouazizi</span><span class="mu" style="font-size:15px">QA Automation Engineer, Product</span>
        <div class="row" style="gap:22px;margin-top:8px;font-size:13.5px"><span class="row" style="gap:8px">${av("MG", 24)}Reports to Mariam Gharbi</span><span class="row stack" style="gap:0">${av("LB", 24)}${av("KM", 24)}${av("RT", 24)}</span><span class="mu">5 on the team</span><span class="mu">2 years, 3 months here</span></div></div>

  </div>
  <div class="cols">
    <div class="rail"><div><div class="lab">Work email</div>aicha.bouazizi@carthage.example</div><div><div class="lab">Phone</div>+216 22 410 553</div><div><div class="lab">Employee number</div>CD-0142</div><div><div class="lab">Place</div>Tunis, Lac 2</div><div><div class="lab">On the chart</div>Product › QA</div></div>

// ---- state ----
const KEY = "fusion-b397-colour-v1";
let ui = { theme: "dark", page: "person" };
let state = { dark: null, light: null, note: "" };
let db = null, saveTimer = null, writing = false, dirty = false;
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = { ...state, ...s }; } catch {}
const pickOf = th => state[th] || REC[th];
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  const s = document.getElementById("saved");
  if (!db) { s.textContent = "Saved in this browser"; return; }
  dirty = true; s.textContent = "Saving…"; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (writing || !dirty) return; writing = true; dirty = false;
  const s = document.getElementById("saved");
  try { await db.doc("colour/main").set({ ...state, at: new Date().toISOString() }); s.textContent = dirty ? "Saving…" : "Saved"; } catch { s.textContent = "Not saved"; }
  writing = false; if (dirty) flush();
}
function fit() {
  for (const st of document.querySelectorAll(".stage")) {
    const k = st.clientWidth / 1440; const sc = st.querySelector(".scale");
    sc.style.transform = `scale(${k})`; st.style.height = Math.round(900 * k) + "px";
  }
}
function render() {
  const th = ui.theme;
  const html = ui.page === "person" ? personPage() : peoplePage();
  const box = document.getElementById("takes");
  box.innerHTML = TAKES[th].map(([id, name, t]) => `<section class="take"><div class="take-head"><span class="name">${name}</span>${REC[th] === id ? `<span class="star">★ my pick</span>` : ""}<span class="grow"></span><button class="pick" type="button" data-id="${id}" aria-pressed="${pickOf(th) === id}">${pickOf(th) === id ? "Chosen" : "Choose"}</button></div><div class="stage ${pickOf(th) === id ? "on" : ""}"><div class="scale"><div class="f" style="${vars(th, t)}">${html}</div></div></div></section>`).join("");
  for (const b of box.querySelectorAll(".pick")) b.addEventListener("click", () => { state[th] = b.dataset.id === REC[th] ? null : b.dataset.id; persist(); render(); });
  for (const b of document.querySelectorAll("[data-th]")) b.setAttribute("aria-pressed", String(b.dataset.th === th));
  for (const b of document.querySelectorAll("[data-pg]")) b.setAttribute("aria-pressed", String(b.dataset.pg === ui.page));
  const nameOf = t => TAKES[t].find(x => x[0] === pickOf(t))[1];
  document.getElementById("p-dark").textContent = nameOf("dark");
  document.getElementById("p-light").textContent = nameOf("light");
  const note = document.getElementById("note"); if (document.activeElement !== note) note.value = state.note || "";
  fit();
}
for (const b of document.querySelectorAll("[data-th]")) b.addEventListener("click", () => { ui.theme = b.dataset.th; render(); });
for (const b of document.querySelectorAll("[data-pg]")) b.addEventListener("click", () => { ui.page = b.dataset.pg; render(); });
document.getElementById("note").addEventListener("input", e => { state.note = e.target.value; persist(); });
window.addEventListener("resize", fit);
document.getElementById("copy").addEventListener("click", async () => {
  const name = t => TAKES[t].find(x => x[0] === pickOf(t))[1];
  const text = `B-397 colour: my choices\n- Dark: ${name("dark")}${pickOf("dark") === REC.dark ? " (as recommended)" : ""}\n- Light: ${name("light")}${pickOf("light") === REC.light ? " (as recommended)" : ""}${state.note.trim() ? "\nNote: " + state.note.trim() : ""}`;
  try { await navigator.clipboard.writeText(text); const t = document.getElementById("toast"); t.textContent = "Copied. Paste it in the chat."; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1600); }
  catch { const box = document.getElementById("copybox"), a = document.getElementById("copytext"); a.value = text; box.hidden = false; a.focus(); a.select(); }
});
render();
document.fonts?.ready?.then(fit);

(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { document.getElementById("saved").textContent = ""; return; }
  db.doc("colour/main").onSnapshot(snap => {
    if (!snap.exists || dirty || writing || snap.metadata.hasPendingWrites) return;
    if (document.activeElement?.tagName === "TEXTAREA") return;
    const data = JSON.parse(JSON.stringify(snap.data() || {}));
    state = { dark: data.dark ?? null, light: data.light ?? null, note: data.note || "" };
    render();
  }, () => { document.getElementById("saved").textContent = ""; });
})();
</script>
