<title>Reviews and year end</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Explorer chrome: a quiet bar of choices around full-size 1440x900 Fusion frames drawn in D-32's tokens. */
:root {
  --bg: oklch(0.975 0.004 286); --fg: oklch(0.2 0.006 286); --muted: oklch(0.52 0.014 286); --line: oklch(0.91 0.004 286);
  --chip: oklch(0.993 0.004 286); --accent: oklch(0.852 0.199 91.9); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.55 0.13 264);
  --sans: "Geist", "Segoe UI", system-ui, sans-serif; --serif: "Lora", Georgia, serif; --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.185 0.004 286); --fg: oklch(0.97 0.002 286); --muted: oklch(0.72 0.012 286); --line: oklch(1 0 0 / 0.1);
  --chip: oklch(0.235 0.004 286); --accent: oklch(0.795 0.184 86); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.75 0.12 264); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: oklch(0.185 0.004 286); --fg: oklch(0.97 0.002 286); --muted: oklch(0.72 0.012 286); --line: oklch(1 0 0 / 0.1);
  --chip: oklch(0.235 0.004 286); --accent: oklch(0.795 0.184 86); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.75 0.12 264); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.xbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in, main { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.name { font-family: var(--serif); font-size: 19px; font-weight: 500; white-space: nowrap; }
.grow { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.saved { font-size: 12px; color: var(--muted); min-width: 60px; }
.copy { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
main { padding-block: 18px 60px; display: grid; gap: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span { font-size: 12px; color: var(--muted); }
.stage { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); background: var(--chip); }
.scaler { transform-origin: 0 0; width: 1440px; height: 900px; }
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.q { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 9px; align-content: start; }
.q-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.q-t { font-weight: 600; }
.q-show { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; text-align: left; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.pick .star { opacity: 0.75; margin-left: 4px; font-size: 11px; }
.feel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.feel b { font-family: var(--serif); font-weight: 500; font-size: 17px; }
textarea.note { width: 100%; min-height: 64px; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font: inherit; resize: vertical; }
.banner { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.copybox { display: grid; gap: 6px; }
.copybox textarea { width: 100%; min-height: 140px; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px; font: 12px/1.5 var(--mono); }

/* ================= The Fusion frame, D-32 ================= */
.fx {
  --page: oklch(0.215 0.004 286); --card: oklch(0.255 0.004 286); --inlay: oklch(0.29 0.004 286); --sb: oklch(0.2 0.004 286); --pop: oklch(0.3 0.005 286);
  --f: oklch(0.97 0.002 286); --mu: oklch(0.72 0.012 286); --hl: oklch(1 0 0 / 0.08); --gh: oklch(1 0 0 / 0.1);
  --pr: oklch(0.795 0.184 86); --pri: oklch(0.28 0.07 60); --pr-text: oklch(0.83 0.16 88);
  --ok: oklch(0.78 0.15 162); --oks: oklch(0.78 0.15 162 / 0.16); --wa: oklch(0.82 0.16 86); --was: oklch(0.8 0.18 86 / 0.16);
  --no: oklch(0.704 0.191 22.2); --nos: oklch(0.704 0.191 22.2 / 0.16); --ai: oklch(0.78 0.11 300);
  --i1: oklch(0.76 0.12 255); --i2: oklch(0.78 0.1 185); --i3: oklch(0.8 0.15 140); --i4: oklch(0.75 0.14 295); --i5: oklch(0.76 0.15 340); --i6: oklch(0.78 0.13 60);
  --scrim: oklch(0.1 0 0 / 0.5); --shadow: 0 14px 40px -18px oklch(0 0 0 / 0.7);
  --r-surface: 20px; --r-inset: 14px; --r-control: 12px;
  width: 1440px; height: 900px; display: flex; position: relative; overflow: hidden;
  background: var(--page); color: var(--f); font-family: var(--sans); font-size: 14px; line-height: 1.45; color-scheme: dark;
}
.fx[data-t="light"] {
  --page: oklch(0.975 0.004 286); --card: oklch(0.993 0.003 286); --inlay: oklch(0.958 0.004 286); --sb: oklch(0.965 0.004 286); --pop: oklch(0.995 0.002 286);
  --f: oklch(0.2 0.006 286); --mu: oklch(0.52 0.014 286); --hl: oklch(0.91 0.004 286); --gh: oklch(0.2 0.004 286 / 0.08);
  --pr: oklch(0.852 0.199 91.9); --pri: oklch(0.28 0.07 60); --pr-text: oklch(0.55 0.13 70);
  --ok: oklch(0.55 0.15 160); --oks: oklch(0.6 0.15 160 / 0.14); --wa: oklch(0.55 0.13 70); --was: oklch(0.85 0.19 92 / 0.3);
  --no: oklch(0.577 0.245 27.3); --nos: oklch(0.577 0.245 27.3 / 0.12); --ai: oklch(0.5 0.16 300);
  --i1: oklch(0.52 0.15 255); --i2: oklch(0.52 0.1 185); --i3: oklch(0.53 0.14 140); --i4: oklch(0.52 0.17 295); --i5: oklch(0.55 0.18 340); --i6: oklch(0.58 0.15 50);
  --scrim: oklch(0.2 0 0 / 0.25); --shadow: 0 14px 40px -18px oklch(0 0 0 / 0.25); color-scheme: light;
}
@supports (corner-shape: squircle) { .fx { --r-surface: 36px; --r-inset: 22px; --r-control: 22px; } .fx .sq { corner-shape: squircle; } }
.fx svg.ic { width: var(--s, 18px); height: var(--s, 18px); flex: none; }
.fx .sb { width: 248px; flex: none; background: var(--sb); padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 1px; box-shadow: inset -1px 0 0 var(--hl); }
.fx .co { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
.fx .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--pr); color: var(--pri); display: grid; place-items: center; font-weight: 700; }
.fx .co b { display: block; font-size: 14px; } .fx .co small { color: var(--mu); font-size: 12px; }
.fx .ni { display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: var(--r-control); color: var(--mu); font-size: 14px; cursor: default; }
.fx .ni.on { background: var(--inlay); color: var(--f); font-weight: 600; }
.fx .ni .ct { margin-left: auto; font-size: 11.5px; background: var(--inlay); color: var(--f); padding: 0 7px; border-radius: 99px; font-weight: 600; }
.fx .ni.on .ct { background: var(--card); }
.fx .grp { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mu); padding: 14px 10px 5px; display: flex; align-items: center; gap: 8px; }
.fx .grp.fold { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--mu); padding: 7px 10px; }
.fx .grp.fold.open { color: var(--f); font-weight: 600; }
.fx .switch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-control); background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); margin: 8px 0 6px; font-weight: 600; }
.fx .switch .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--was); color: var(--pr-text); display: grid; place-items: center; }
.fx .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--hl); }
.fx .me small { display: block; color: var(--mu); font-size: 12px; }
.fx .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.fx .top { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 22px 0 28px; }
.fx .crumb { display: flex; align-items: center; gap: 8px; color: var(--mu); font-size: 14px; }
.fx .crumb b { color: var(--f); font-weight: 500; }
.fx .crumb .ic { --s: 14px; }
.fx .search { margin-left: auto; width: 300px; height: 36px; border-radius: var(--r-control); background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); color: var(--mu); display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 13px; }
.fx .search kbd { margin-left: auto; font: 11px var(--mono); background: var(--inlay); padding: 1px 6px; border-radius: 6px; }
.fx .tb { color: var(--mu); display: grid; place-items: center; width: 34px; height: 34px; }
.fx .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.fx .pg { padding: 6px 36px 48px; display: grid; gap: 22px; max-width: 1120px; }

/* type roles */
.fx .t-page { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -0.01em; }
.fx .t-sec { font-weight: 600; font-size: 17px; }
.fx[data-serif="a"] .t-sec { font-family: var(--serif); font-weight: 500; font-size: 20px; }
.fx .t-words { font-weight: 600; }
.fx[data-serif="a"] .t-words, .fx[data-serif="b"] .t-words { font-family: var(--serif); font-weight: 500; }
.fx .t-quote { font-size: 14.5px; }
.fx[data-serif="a"] .t-quote, .fx[data-serif="b"] .t-quote { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; }
.fx .mu { color: var(--mu); } .fx .sm { font-size: 12.5px; } .fx .num { font-variant-numeric: tabular-nums; }

/* shapes */
.fx .card { background: var(--card); border-radius: var(--r-surface); padding: 22px 24px; display: grid; gap: 14px; }
.fx .inl { background: var(--inlay); border-radius: var(--r-inset); padding: 12px 14px; }
.fx .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fx .col { display: grid; gap: 4px; min-width: 0; }
.fx .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 15px; border-radius: var(--r-control); font-weight: 600; font-size: 13.5px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); border: 0; cursor: pointer; white-space: nowrap; }
.fx .btn.p { background: var(--pr); color: var(--pri); box-shadow: none; }
.fx .btn.g { background: none; box-shadow: none; color: var(--mu); padding: 0 8px; }
.fx .btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
.fx .btn .ic { --s: 16px; }
.fx .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--inlay); white-space: nowrap; font-weight: 500; }
.fx .chip.ok { background: var(--oks); color: var(--ok); } .fx .chip.wa { background: var(--was); color: var(--wa); } .fx .chip.no { background: var(--nos); color: var(--no); }
.fx .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.fx .av { --s: 32px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; display: grid; place-items: center; font-size: calc(var(--s) * 0.36); font-weight: 600; color: var(--h); background: color-mix(in oklab, var(--h) 16%, var(--card)); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--h) 70%, transparent); }
.fx .faces { display: flex; } .fx .faces .av { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--h) 70%, transparent), 0 0 0 2px var(--card); margin-left: -6px; } .fx .faces .av:first-child { margin-left: 0; }
.fx .bar { height: 8px; border-radius: 99px; background: var(--inlay); overflow: hidden; display: flex; }
.fx input { background: var(--inlay); color: var(--f); border: 0; border-radius: 10px; padding: 7px 10px; font: 13.5px var(--sans); }
.fx input:focus { outline: 2px solid var(--pr); outline-offset: 1px; }
.fx .bar i { display: block; height: 100%; transition: width 0.6s cubic-bezier(.2,.7,.2,1); }
.fx .link { color: var(--pr-text); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.fx .click { cursor: pointer; }
.fx .click:hover { background: color-mix(in oklab, var(--f) 4%, transparent); }
.fx .rise { animation: rise 0.45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fx .rise { animation: none; } .fx .bar i, .fx .tl-today { transition: none !important; } }

/* computed marks (taste: how Fusion's work is marked) */
.fx .mk-ai { display: inline-flex; align-items: center; gap: 4px; color: var(--ai); font-size: 12px; font-weight: 500; }
.fx .mk-ai .ic { --s: 14px; }
.fx .mk-fu { display: inline-flex; align-items: center; gap: 4px; color: var(--mu); font-size: 12px; }
.fx .mk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); display: inline-block; }

/* timeline */
.fx .tl { position: relative; padding-top: 4px; }
.fx .tl-phases { position: relative; height: 26px; }
.fx .tl-ph { position: absolute; top: 0; font-size: 13px; color: var(--mu); white-space: nowrap; }
.fx .tl-ph.on { color: var(--f); font-weight: 600; }
.fx .tl-ph.end { transform: translateX(-100%); }
.fx .tl-track { position: relative; height: 12px; display: flex; gap: 3px; }
.fx .tl-seg { height: 100%; border-radius: 99px; background: var(--inlay); position: relative; overflow: hidden; }
.fx .tl-seg i { position: absolute; inset: 0 auto 0 0; background: color-mix(in oklab, var(--pr) 45%, var(--inlay)); transition: width 0.8s cubic-bezier(.2,.7,.2,1); }
.fx .tl-seg.on i { background: var(--pr); }
.fx .tl-ms { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 1.5px var(--mu); }
.fx .tl-today { position: absolute; top: 24px; height: 24px; width: 0; transition: left 0.9s cubic-bezier(.2,.7,.2,1); }
.fx .tl-today::before { content: ""; position: absolute; inset: 0 auto 0 -1px; width: 2px; background: var(--f); border-radius: 2px; }
.fx .tl-today span { position: absolute; top: 30px; left: 0; transform: translateX(var(--tx, -50%)); font-size: 12px; font-weight: 600; background: var(--f); color: var(--page); padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.fx .tl-months { position: relative; height: 16px; margin-top: 40px; }
.fx .tl-months span { position: absolute; font-size: 11.5px; color: var(--mu); transform: translateX(-50%); }
.fx .tl-next { position: absolute; right: 0; top: 0; }
.fx .tl.thin { padding: 0; }
.fx .tl.thin .tl-track { height: 6px; }

/* next step */
.fx .next { position: relative; background: var(--card); border-radius: var(--r-surface); padding: 24px 26px; display: grid; gap: 16px; }
.fx .next .caret { position: absolute; top: -9px; width: 18px; height: 18px; background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 4px; transition: left 0.9s cubic-bezier(.2,.7,.2,1); }
.fx .next-h { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; }
.fx .next-t { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.fx .eyebrow { font-size: 12.5px; color: var(--mu); display: flex; align-items: center; gap: 8px; }
.fx .due { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu); }
.fx .due .ic { --s: 15px; }

/* lists */
.fx .goal { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 6px 22px; align-items: center; padding: 14px 16px; border-radius: var(--r-inset); }
.fx .goal + .goal { box-shadow: 0 -1px 0 var(--hl); border-radius: 0; }
.fx .goal .gt { font-size: 15.5px; }
.fx .line-up { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); }
.fx .line-up .ic { --s: 14px; }
.fx .line-up b { color: var(--f); font-weight: 500; }
.fx .people { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.fx .pc { background: var(--inlay); border-radius: var(--r-inset); padding: 14px 12px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.fx .pc .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.fx .div-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 70px; gap: 14px; align-items: center; padding: 7px 0; }
.fx .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); }
.fx .legend span { display: inline-flex; align-items: center; gap: 6px; }

/* sheet over the page */
.fx .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 4; animation: fade 0.2s both; }
@keyframes fade { from { opacity: 0; } }
.fx .sheet { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 580px; z-index: 5; background: var(--pop); border-radius: var(--r-surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--hl); display: flex; flex-direction: column; animation: slide 0.32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.fx .sheet-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px 26px; }
.fx .sheet-b { flex: 1; overflow: auto; padding: 8px 26px 26px; display: grid; gap: 18px; align-content: start; }
.fx .sheet-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; box-shadow: 0 -1px 0 var(--hl); }
.fx .x { width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--mu); display: grid; place-items: center; cursor: pointer; margin-left: auto; }
.fx .toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--f); color: var(--page); padding: 9px 10px 9px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-weight: 500; z-index: 9; animation: rise 0.3s both; }
.fx .toast button { border: 0; background: none; color: inherit; font-weight: 700; cursor: pointer; padding: 2px 6px; }

/* goals page */
.fx .tabs { display: flex; gap: 4px; }
.fx .tab { padding: 7px 14px; border-radius: 99px; color: var(--mu); font-weight: 500; }
.fx .tab.on { color: var(--pr-text); box-shadow: inset 0 0 0 1.5px var(--pr); font-weight: 600; }
.fx .cg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fx .cgo { background: var(--card); border-radius: var(--r-inset); padding: 14px 16px; display: grid; gap: 8px; align-content: start; transition: box-shadow 0.4s; }
.fx .cgo.lit { box-shadow: inset 0 0 0 1.5px var(--pr); }
.fx .unit-g { background: var(--inlay); border-radius: 12px; padding: 9px 11px; display: grid; gap: 2px; }
.fx .pgoal { background: var(--card); border-radius: var(--r-surface); padding: 20px 22px; display: grid; gap: 10px; }
.fx .pgoal-h { display: flex; align-items: flex-start; gap: 16px; }
.fx .wt { margin-left: auto; display: grid; justify-items: end; gap: 2px; }
.fx .wt button { border: 0; background: var(--inlay); color: var(--f); font: 600 15px var(--sans); padding: 4px 10px; border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums; }

.fx .nextlv { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 12px; background: var(--inlay); font-size: 13px; animation: rise 0.3s both; }

.fx .fc { background: var(--card); border-radius: var(--r-surface); padding: 22px 24px 20px; display: grid; gap: 16px; animation: rise 0.4s both; }
.fx .fc-h { display: flex; align-items: center; gap: 14px; }
.fx .fc-mid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 34px; align-items: center; }
.fx .fc-f { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 14px; box-shadow: 0 -1px 0 var(--hl); }
.fx .why { font-size: 15px; font-weight: 600; color: var(--wa); }
.fx .trk { position: relative; height: 70px; margin: 0 10px; }
.fx .trk-line { position: absolute; left: 0; right: 0; top: 36px; height: 4px; border-radius: 99px; background: var(--inlay); }
.fx .trk-tick { position: absolute; top: 33px; width: 2px; height: 10px; margin-left: -1px; border-radius: 2px; background: color-mix(in oklab, var(--mu) 45%, transparent); }
.fx .trk-lb { position: absolute; top: 52px; font-size: 11.5px; color: var(--mu); transform: translateX(-50%); white-space: nowrap; }
.fx .trk-lb.first { transform: none; } .fx .trk-lb.last { transform: translateX(-100%); }
.fx .trk-gap { position: absolute; top: 36px; height: 4px; background: color-mix(in oklab, var(--wa) 55%, transparent); }
.fx .trk-mk { position: absolute; top: 31px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; box-shadow: 0 0 0 3px var(--card); transition: left 0.5s cubic-bezier(.2,.7,.2,1); }

.fx .reason input { flex: 1; height: 36px; }

.fx .full { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
.fx .spread { display: grid; gap: 14px; }

// ---------- the year's timeline (D-44) ----------
function timeline(today, phases = PHASES, o = {}) {
  const ph = phases.findIndex((p) => today >= p.s && today < p.e);
  const segs = phases.map((p, i) => {
    const w = days(p.s, p.e) / span * 100;
    const fill = o.ghost ? 0 : today >= p.e ? 100 : today <= p.s ? 0 : days(p.s, today) / days(p.s, p.e) * 100;
    return `<div class="tl-seg ${!o.ghost && i === ph ? "on" : ""} ${o.ghost ? "gh" : ""}" data-tw="seg${i}" style="width:calc(${w}% - 2px)"><i data-tw="segi${i}" style="width:${fill}%"></i></div>`;
  }).join("");
  if (o.thin) return `<div class="tl thin"><div class="tl-track">${segs}</div></div>`;
  const labels = phases.map((p, i) => {
    const end = i === phases.length - 1;
    if (!end && i !== ph && pos(phases[i + 1].s) - pos(p.s) < 0.07) return "";
    return `<span class="tl-ph ${!o.ghost && i === ph ? "on" : ""} ${end ? "end" : ""}" style="left:${end ? 100 : pos(p.s) * 100}%">${p.n}</span>`;

const ANIM = ".rise, .fc, .decided, .mg-x, .reason, .drop, .nextlv, .landing .av, .toast, .scrim, .dlg, .ny-x, .pv";
const animKey = (el) => el.className.replace(" noanim", "") + "|" + (el.dataset.anim || el.textContent.trim().replace(/\s+/g, " ").slice(0, 80));

function renderFrame() {

  const pg = PAGES[ui.screen]();
  const sc = fx.querySelector(".scroll, .rv-form"), top = sc ? sc.scrollTop : 0;
  // a re-render keeps what was already on screen still: entrances play once, widths move from where they were
  const settled = ui.keepScroll ? new Set([...fx.querySelectorAll(ANIM)].map(animKey)) : new Set();
  const was = ui.keepScroll ? new Map([...fx.querySelectorAll("[data-tw]")].map((el) => [el.dataset.tw, el.getAttribute("style")])) : new Map();
  fx.innerHTML = sidebar(pg.v, pg.here, pg.counts) + `<div class="main">${topbar(pg.crumbs)}${pg.main}${pg.over || ""}${ui.toast ? `<div class="toast" role="status"><span>${esc(ui.toast.msg)}</span>${ui.toast.undo ? `<button data-act="undo">Undo</button>` : ""}</div>` : ""}</div>`;
  fx.querySelectorAll(ANIM).forEach((el) => { if (settled.has(animKey(el))) el.classList.add("noanim"); });
  const moving = [];
  fx.querySelectorAll("[data-tw]").forEach((el) => { const old = was.get(el.dataset.tw), now = el.getAttribute("style"); if (old != null && old !== now) { el.setAttribute("style", old); moving.push([el, now]); } });
  if (moving.length) { void fx.offsetWidth; moving.forEach(([el, now]) => el.setAttribute("style", now)); }
  const sc2 = fx.querySelector(".scroll, .rv-form"); if (sc2 && ui.keepScroll) sc2.scrollTop = top;
  ui.keepScroll = true;
}

  // the year's end
  else if (a === "carry") { ui.carry = t.dataset.v; if (ui.carry === "drop") toast("Dropped from your FY2028 draft", () => { ui.carry = "keep"; }); }
  else if (a === "starter") { ui.starter = t.dataset.v || null; if (ui.starter === "added") toast("Added to your FY2028 draft", () => { ui.starter = null; }); }
  renderFrame();
});
fxEl.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.t) ui.text[el.dataset.t] = el.value;
  else if (el.id === "pq1") ui.pq1 = el.value;
  else if (el.id === "pq2") ui.pq2 = el.value;
  else if (el.id?.startsWith("why-")) ui.why[el.id.slice(4)] = el.value;
});
fxEl.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (ui.rel === "preview") { ui.rel = "idle"; renderFrame(); }
  else if (ui.drop) { ui.drop = null; renderFrame(); }
});
// the full view: drag a face to another column
fxEl.addEventListener("dragstart", (e) => { const k = e.target.closest?.("[data-drag]")?.dataset.drag; if (!k) return; e.dataTransfer.setData("text/plain", k); e.dataTransfer.effectAllowed = "move"; });
fxEl.addEventListener("dragover", (e) => {
  const c = e.target.closest?.("[data-cell]"); if (!c) return;
  e.preventDefault(); if (ui.over !== c.dataset.cell) { fxEl.querySelectorAll(".nb-cell.over").forEach((x) => x.classList.remove("over")); c.classList.add("over"); ui.over = c.dataset.cell; }
});
fxEl.addEventListener("dragleave", (e) => { const c = e.target.closest?.("[data-cell]"); if (c && !c.contains(e.relatedTarget)) { c.classList.remove("over"); if (ui.over === c.dataset.cell) ui.over = null; } });
fxEl.addEventListener("drop", (e) => {
  const c = e.target.closest?.("[data-cell]"); if (!c) return;
  e.preventDefault(); ui.over = null;
  const k = e.dataTransfer.getData("text/plain"); if (!P[k]) return renderFrame();
  const col = +c.dataset.cell.split("-")[1];
  if (col === band(levelOf(k))) return renderFrame();
  const to = col === 0 ? 1 : col === 1 ? 2 : Math.max(3, LV[k] >= 3 ? LV[k] : 3);
  ui.drop = { k, to }; renderFrame(); document.getElementById("drop-why")?.focus();
});

// ---------- chrome interactions ----------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.closest("#fx")) return;
  const reset = () => { clearInterval(relTimer); clearTimeout(toastT); Object.assign(ui, fresh(), { toast: null }); };
  if (b.dataset.screen) { const keep = { rs: ui.rs, cs: ui.cs, es: ui.es }; reset(); Object.assign(ui, keep); ui.screen = b.dataset.screen; return render(); }
  if (b.dataset.themeSet) { ui.theme = b.dataset.themeSet; try { localStorage.setItem(KEY + "-t", ui.theme); } catch {} return render(); }
  for (const k of ["rs", "cs", "es"]) if (b.dataset[k]) { ui[k] = b.dataset[k]; ui.opened = false; ui.drop = null; ui.toast = null; return render(); }
  if (b.dataset.show) { reset(); Object.assign(ui, Q[b.dataset.show].show); return render(); }
  if (b.dataset.actChrome === "reset") { const s = ui.screen, keep = { rs: ui.rs, cs: ui.cs, es: ui.es }; reset(); Object.assign(ui, keep, { screen: s }); return render(); }
  if (b.dataset.q) { state.answers[b.dataset.q] = b.dataset.o; persist(); ui.drop = null; return render(); }
});
document.getElementById("note").addEventListener("input", (e) => { state.note = e.target.value; persist(); });
document.getElementById("copy").addEventListener("click", async () => {
  const lines = [`Performance, reviews and the end of the year (B-412, 3c)`].concat(Object.entries(Q).map(([k, q]) => `${q.t}: ${(q.o.find(([o]) => o === state.answers[k]) || [, "not answered"])[1]}${q.rec && q.rec !== state.answers[k] ? " (changed from the pick)" : ""}`));
  if (state.note) lines.push("Note: " + state.note);
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); document.getElementById("saved").textContent = "Copied"; }
  catch { const box = document.getElementById("copybox"); box.hidden = false; const ta = document.getElementById("copytext"); ta.value = text; ta.select(); }
});

// ---------- saving: the artifact's store when published, this browser otherwise ----------
let saveTimer = null, writing = false, dirty = false;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  const s = document.getElementById("saved");
  if (!db) { s.textContent = "Saved in this browser"; return; }
  dirty = true; s.textContent = "Saving…"; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600);
}
async function flush() {
  if (writing || !dirty) return;
  writing = true; dirty = false; const s = document.getElementById("saved");
  try { await db.doc("reviews/main").set({ answers: { ...state.answers }, note: state.note || "", at: new Date().toISOString() }); s.textContent = dirty ? "Saving…" : "Saved"; }
  catch (err) { s.textContent = "Not saved"; if (err && ["permission_denied", "not_granted", "invalid_argument"].includes(err.code)) { const bn = document.getElementById("banner"); bn.textContent = "You can view this page but not change it."; bn.hidden = false; } }
  writing = false; if (dirty) flush();
}

try { const t = localStorage.getItem(KEY + "-t"); if (t === "light" || t === "dark") ui.theme = t; } catch {}
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { document.getElementById("saved").textContent = "Saved in this browser"; return; }
  document.getElementById("saved").textContent = "Saved";
  db.doc("reviews/main").onSnapshot((snap) => {
    if (!snap.exists || dirty || writing || snap.metadata?.hasPendingWrites) return;
    if (document.activeElement?.id === "note") return;
    const data = JSON.parse(JSON.stringify(snap.data() || {})); // snapshots are frozen
    state = { ...blank(), answers: { ...blank().answers, ...(data.answers || {}) }, note: data.note || "" };
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    render();
  }, () => {});
})();
</script>
