<title>Setting Up a Year</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Explorer chrome: a quiet bar of choices around full-size 1440x900 Fusion frames drawn in D-32's tokens. */
:root {
  --bg: oklch(0.975 0.004 286); --fg: oklch(0.2 0.006 286); --muted: oklch(0.52 0.014 286); --line: oklch(0.91 0.004 286);
  --chip: oklch(0.993 0.004 286); --accent: oklch(0.852 0.199 91.9); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.55 0.13 264);
  --sans: "Geist", "Segoe UI", system-ui, sans-serif; --serif: "Lora", Georgia, serif; --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.185 0.004 286); --fg: oklch(0.97 0.002 286); --muted: oklch(0.72 0.012 286); --line: oklch(1 0 0 / 0.1);
  --chip: oklch(0.235 0.004 286); --accent: oklch(0.795 0.184 86); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.75 0.12 264); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: oklch(0.185 0.004 286); --fg: oklch(0.97 0.002 286); --muted: oklch(0.72 0.012 286); --line: oklch(1 0 0 / 0.1);
  --chip: oklch(0.235 0.004 286); --accent: oklch(0.795 0.184 86); --accent-ink: oklch(0.28 0.07 60); --focus: oklch(0.75 0.12 264); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.xbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in, main { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.name { font-family: var(--serif); font-size: 19px; font-weight: 500; white-space: nowrap; }
.grow { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.saved { font-size: 12px; color: var(--muted); min-width: 60px; }
.copy { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
main { padding-block: 18px 60px; display: grid; gap: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span { font-size: 12px; color: var(--muted); }
.stage { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); background: var(--chip); }
.scaler { transform-origin: 0 0; width: 1440px; height: 900px; }
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.q { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 9px; align-content: start; }
.q-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.q-t { font-weight: 600; }
.q-show { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; text-align: left; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.pick .star { opacity: 0.75; margin-left: 4px; font-size: 11px; }
.feel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.feel b { font-family: var(--serif); font-weight: 500; font-size: 17px; }
textarea.note { width: 100%; min-height: 64px; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font: inherit; resize: vertical; }
.banner { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.copybox { display: grid; gap: 6px; }
.copybox textarea { width: 100%; min-height: 140px; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 9px; font: 12px/1.5 var(--mono); }

/* ================= The Fusion frame, D-32 ================= */
.fx {
  --page: oklch(0.215 0.004 286); --card: oklch(0.255 0.004 286); --inlay: oklch(0.29 0.004 286); --sb: oklch(0.2 0.004 286); --pop: oklch(0.3 0.005 286);
  --f: oklch(0.97 0.002 286); --mu: oklch(0.72 0.012 286); --hl: oklch(1 0 0 / 0.08); --gh: oklch(1 0 0 / 0.1);
  --pr: oklch(0.795 0.184 86); --pri: oklch(0.28 0.07 60); --pr-text: oklch(0.83 0.16 88);
  --ok: oklch(0.78 0.15 162); --oks: oklch(0.78 0.15 162 / 0.16); --wa: oklch(0.82 0.16 86); --was: oklch(0.8 0.18 86 / 0.16);
  --no: oklch(0.704 0.191 22.2); --nos: oklch(0.704 0.191 22.2 / 0.16); --ai: oklch(0.78 0.11 300);
  --i1: oklch(0.76 0.12 255); --i2: oklch(0.78 0.1 185); --i3: oklch(0.8 0.15 140); --i4: oklch(0.75 0.14 295); --i5: oklch(0.76 0.15 340); --i6: oklch(0.78 0.13 60);
  --scrim: oklch(0.1 0 0 / 0.5); --shadow: 0 14px 40px -18px oklch(0 0 0 / 0.7);
  --r-surface: 20px; --r-inset: 14px; --r-control: 12px;
  width: 1440px; height: 900px; display: flex; position: relative; overflow: hidden;
  background: var(--page); color: var(--f); font-family: var(--sans); font-size: 14px; line-height: 1.45; color-scheme: dark;
}
.fx[data-t="light"] {
  --page: oklch(0.975 0.004 286); --card: oklch(0.993 0.003 286); --inlay: oklch(0.958 0.004 286); --sb: oklch(0.965 0.004 286); --pop: oklch(0.995 0.002 286);
  --f: oklch(0.2 0.006 286); --mu: oklch(0.52 0.014 286); --hl: oklch(0.91 0.004 286); --gh: oklch(0.2 0.004 286 / 0.08);
  --pr: oklch(0.852 0.199 91.9); --pri: oklch(0.28 0.07 60); --pr-text: oklch(0.55 0.13 70);
  --ok: oklch(0.55 0.15 160); --oks: oklch(0.6 0.15 160 / 0.14); --wa: oklch(0.55 0.13 70); --was: oklch(0.85 0.19 92 / 0.3);
  --no: oklch(0.577 0.245 27.3); --nos: oklch(0.577 0.245 27.3 / 0.12); --ai: oklch(0.5 0.16 300);
  --i1: oklch(0.52 0.15 255); --i2: oklch(0.52 0.1 185); --i3: oklch(0.53 0.14 140); --i4: oklch(0.52 0.17 295); --i5: oklch(0.55 0.18 340); --i6: oklch(0.58 0.15 50);
  --scrim: oklch(0.2 0 0 / 0.25); --shadow: 0 14px 40px -18px oklch(0 0 0 / 0.25); color-scheme: light;
}
@supports (corner-shape: squircle) { .fx { --r-surface: 36px; --r-inset: 22px; --r-control: 22px; } .fx .sq { corner-shape: squircle; } }
.fx svg.ic { width: var(--s, 18px); height: var(--s, 18px); flex: none; }
.fx .sb { width: 248px; flex: none; background: var(--sb); padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 1px; box-shadow: inset -1px 0 0 var(--hl); }
.fx .co { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
.fx .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--pr); color: var(--pri); display: grid; place-items: center; font-weight: 700; }
.fx .co b { display: block; font-size: 14px; } .fx .co small { color: var(--mu); font-size: 12px; }
.fx .ni { display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: var(--r-control); color: var(--mu); font-size: 14px; cursor: default; }
.fx .ni.on { background: var(--inlay); color: var(--f); font-weight: 600; }
.fx .ni .ct { margin-left: auto; font-size: 11.5px; background: var(--inlay); color: var(--f); padding: 0 7px; border-radius: 99px; font-weight: 600; }
.fx .ni.on .ct { background: var(--card); }
.fx .grp { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mu); padding: 14px 10px 5px; display: flex; align-items: center; gap: 8px; }
.fx .grp.fold { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--mu); padding: 7px 10px; }
.fx .grp.fold.open { color: var(--f); font-weight: 600; }
.fx .switch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-control); background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); margin: 8px 0 6px; font-weight: 600; }
.fx .switch .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--was); color: var(--pr-text); display: grid; place-items: center; }
.fx .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--hl); }
.fx .me small { display: block; color: var(--mu); font-size: 12px; }
.fx .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.fx .top { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 22px 0 28px; }
.fx .crumb { display: flex; align-items: center; gap: 8px; color: var(--mu); font-size: 14px; }
.fx .crumb b { color: var(--f); font-weight: 500; }
.fx .crumb .ic { --s: 14px; }
.fx .search { margin-left: auto; width: 300px; height: 36px; border-radius: var(--r-control); background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); color: var(--mu); display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 13px; }
.fx .search kbd { margin-left: auto; font: 11px var(--mono); background: var(--inlay); padding: 1px 6px; border-radius: 6px; }
.fx .tb { color: var(--mu); display: grid; place-items: center; width: 34px; height: 34px; }
.fx .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.fx .pg { padding: 6px 36px 48px; display: grid; gap: 22px; max-width: 1120px; }

/* type roles */
.fx .t-page { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -0.01em; }
.fx .t-sec { font-weight: 600; font-size: 17px; }
.fx[data-serif="a"] .t-sec { font-family: var(--serif); font-weight: 500; font-size: 20px; }
.fx .t-words { font-weight: 600; }
.fx[data-serif="a"] .t-words, .fx[data-serif="b"] .t-words { font-family: var(--serif); font-weight: 500; }
.fx .t-quote { font-size: 14.5px; }
.fx[data-serif="a"] .t-quote, .fx[data-serif="b"] .t-quote { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; }
.fx .mu { color: var(--mu); } .fx .sm { font-size: 12.5px; } .fx .num { font-variant-numeric: tabular-nums; }

/* shapes */
.fx .card { background: var(--card); border-radius: var(--r-surface); padding: 22px 24px; display: grid; gap: 14px; }
.fx .inl { background: var(--inlay); border-radius: var(--r-inset); padding: 12px 14px; }
.fx .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fx .col { display: grid; gap: 4px; min-width: 0; }
.fx .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 15px; border-radius: var(--r-control); font-weight: 600; font-size: 13.5px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hl); border: 0; cursor: pointer; white-space: nowrap; }
.fx .btn.p { background: var(--pr); color: var(--pri); box-shadow: none; }
.fx .btn.g { background: none; box-shadow: none; color: var(--mu); padding: 0 8px; }
.fx .btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
.fx .btn .ic { --s: 16px; }
.fx .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--inlay); white-space: nowrap; font-weight: 500; }
.fx .chip.ok { background: var(--oks); color: var(--ok); } .fx .chip.wa { background: var(--was); color: var(--wa); } .fx .chip.no { background: var(--nos); color: var(--no); }
.fx .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.fx .av { --s: 32px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; display: grid; place-items: center; font-size: calc(var(--s) * 0.36); font-weight: 600; color: var(--h); background: color-mix(in oklab, var(--h) 16%, var(--card)); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--h) 70%, transparent); }
.fx .faces { display: flex; } .fx .faces .av { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--h) 70%, transparent), 0 0 0 2px var(--card); margin-left: -6px; } .fx .faces .av:first-child { margin-left: 0; }
.fx .bar { height: 8px; border-radius: 99px; background: var(--inlay); overflow: hidden; display: flex; }
.fx input { background: var(--inlay); color: var(--f); border: 0; border-radius: 10px; padding: 7px 10px; font: 13.5px var(--sans); }
.fx input:focus { outline: 2px solid var(--pr); outline-offset: 1px; }
.fx .bar i { display: block; height: 100%; transition: width 0.6s cubic-bezier(.2,.7,.2,1); }
.fx .link { color: var(--pr-text); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.fx .click { cursor: pointer; }
.fx .click:hover { background: color-mix(in oklab, var(--f) 4%, transparent); }
.fx .rise { animation: rise 0.45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fx .rise { animation: none; } .fx .bar i, .fx .tl-today { transition: none !important; } }

/* computed marks (taste: how Fusion's work is marked) */
.fx .mk-ai { display: inline-flex; align-items: center; gap: 4px; color: var(--ai); font-size: 12px; font-weight: 500; }
.fx .mk-ai .ic { --s: 14px; }
.fx .mk-fu { display: inline-flex; align-items: center; gap: 4px; color: var(--mu); font-size: 12px; }
.fx .mk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); display: inline-block; }

/* timeline */
.fx .tl { position: relative; padding-top: 4px; }
.fx .tl-phases { position: relative; height: 26px; }
.fx .tl-ph { position: absolute; top: 0; font-size: 13px; color: var(--mu); white-space: nowrap; }
.fx .tl-ph.on { color: var(--f); font-weight: 600; }
.fx .tl-ph.end { transform: translateX(-100%); }
.fx .tl-track { position: relative; height: 12px; display: flex; gap: 3px; }
.fx .tl-seg { height: 100%; border-radius: 99px; background: var(--inlay); position: relative; overflow: hidden; }
.fx .tl-seg i { position: absolute; inset: 0 auto 0 0; background: color-mix(in oklab, var(--pr) 45%, var(--inlay)); transition: width 0.8s cubic-bezier(.2,.7,.2,1); }
.fx .tl-seg.on i { background: var(--pr); }
.fx .tl-ms { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 1.5px var(--mu); }
.fx .tl-today { position: absolute; top: 24px; height: 24px; width: 0; transition: left 0.9s cubic-bezier(.2,.7,.2,1); }
.fx .tl-today::before { content: ""; position: absolute; inset: 0 auto 0 -1px; width: 2px; background: var(--f); border-radius: 2px; }
.fx .tl-today span { position: absolute; top: 30px; left: 0; transform: translateX(var(--tx, -50%)); font-size: 12px; font-weight: 600; background: var(--f); color: var(--page); padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.fx .tl-months { position: relative; height: 16px; margin-top: 40px; }
.fx .tl-months span { position: absolute; font-size: 11.5px; color: var(--mu); transform: translateX(-50%); }
.fx .tl-next { position: absolute; right: 0; top: 0; }
.fx .tl.thin { padding: 0; }
.fx .tl.thin .tl-track { height: 6px; }

/* next step */
.fx .next { position: relative; background: var(--card); border-radius: var(--r-surface); padding: 24px 26px; display: grid; gap: 16px; }
.fx .next .caret { position: absolute; top: -9px; width: 18px; height: 18px; background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 4px; transition: left 0.9s cubic-bezier(.2,.7,.2,1); }
.fx .next-h { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; }
.fx .next-t { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.fx .eyebrow { font-size: 12.5px; color: var(--mu); display: flex; align-items: center; gap: 8px; }
.fx .due { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu); }
.fx .due .ic { --s: 15px; }

/* lists */
.fx .goal { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 6px 22px; align-items: center; padding: 14px 16px; border-radius: var(--r-inset); }
.fx .goal + .goal { box-shadow: 0 -1px 0 var(--hl); border-radius: 0; }
.fx .goal .gt { font-size: 15.5px; }
.fx .line-up { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); }
.fx .line-up .ic { --s: 14px; }
.fx .line-up b { color: var(--f); font-weight: 500; }
.fx .people { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.fx .pc { background: var(--inlay); border-radius: var(--r-inset); padding: 14px 12px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.fx .pc .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.fx .div-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 70px; gap: 14px; align-items: center; padding: 7px 0; }
.fx .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--mu); }
.fx .legend span { display: inline-flex; align-items: center; gap: 6px; }

/* sheet over the page */
.fx .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 4; animation: fade 0.2s both; }
@keyframes fade { from { opacity: 0; } }
.fx .sheet { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 580px; z-index: 5; background: var(--pop); border-radius: var(--r-surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--hl); display: flex; flex-direction: column; animation: slide 0.32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.fx .sheet-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px 26px; }
.fx .sheet-b { flex: 1; overflow: auto; padding: 8px 26px 26px; display: grid; gap: 18px; align-content: start; }
.fx .sheet-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; box-shadow: 0 -1px 0 var(--hl); }
.fx .x { width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--mu); display: grid; place-items: center; cursor: pointer; margin-left: auto; }
.fx .toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--f); color: var(--page); padding: 9px 10px 9px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-weight: 500; z-index: 9; animation: rise 0.3s both; }
.fx .toast button { border: 0; background: none; color: inherit; font-weight: 700; cursor: pointer; padding: 2px 6px; }

/* goals page */
.fx .tabs { display: flex; gap: 4px; }
.fx .tab { padding: 7px 14px; border-radius: 99px; color: var(--mu); font-weight: 500; }
.fx .tab.on { color: var(--pr-text); box-shadow: inset 0 0 0 1.5px var(--pr); font-weight: 600; }
.fx .cg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fx .cgo { background: var(--card); border-radius: var(--r-inset); padding: 14px 16px; display: grid; gap: 8px; align-content: start; transition: box-shadow 0.4s; }
.fx .cgo.lit { box-shadow: inset 0 0 0 1.5px var(--pr); }
.fx .unit-g { background: var(--inlay); border-radius: 12px; padding: 9px 11px; display: grid; gap: 2px; }
.fx .pgoal { background: var(--card); border-radius: var(--r-surface); padding: 20px 22px; display: grid; gap: 10px; }
.fx .pgoal-h { display: flex; align-items: flex-start; gap: 16px; }
.fx .wt { margin-left: auto; display: grid; justify-items: end; gap: 2px; }
.fx .wt button { border: 0; background: var(--inlay); color: var(--f); font: 600 15px var(--sans); padding: 4px 10px; border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums; }

.fx .sugg { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: 12px; background: color-mix(in oklab, var(--ai) 9%, var(--card)); font-size: 13px; }

.fx .add { border-radius: var(--r-surface); padding: 16px 22px; box-shadow: inset 0 0 0 1.5px var(--hl); color: var(--mu); display: flex; align-items: center; gap: 10px; }

/* review page */
.fx .rv { display: grid; grid-template-columns: minmax(0, 1fr) 450px; flex: 1; min-height: 0; }

.fx .scale5 { display: flex; gap: 6px; flex-wrap: wrap; }

.fx .react { display: flex; gap: 4px; }

/* round 2: state without badges (D-52) */

/* a grade's measure, behind an icon (D-51) */

.fx .tip:hover::after, .fx .tip:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); right: -6px; background: var(--f); color: var(--page); font: 500 12.5px var(--sans); padding: 5px 10px; border-radius: 9px; white-space: nowrap; z-index: 6; }
/* the phase as people moving through its steps */
.fx .flow { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; }
.fx .fl { display: grid; gap: 12px; align-content: start; padding: 2px 18px 4px; position: relative; }

.fx .fl + .fl::before { content: ""; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-top: 1.5px solid var(--mu); border-right: 1.5px solid var(--mu); transform: rotate(45deg); background: var(--card); opacity: 0.8; }
.fx .fl-h { display: grid; gap: 2px; }
.fx .fl-n { font-size: 13px; color: var(--mu); }
.fx .fl-c { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }

.fx .cluster { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.fx .fl.fl-gh .fl-c, .fx .fl.fl-gh .fl-n { color: color-mix(in oklab, var(--mu) 70%, transparent); }
.fx .faded { opacity: 0.42; filter: saturate(0.4); pointer-events: none; }
.fx .prow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 12px; }

.fx .more { font-size: 12.5px; color: var(--mu); }
/* ghost of what fills in */

.fx .gh-card { border-radius: var(--r-inset); padding: 14px 16px; display: grid; gap: 10px; box-shadow: inset 0 0 0 1.5px var(--hl); }
/* moving the year on, previewed in place */
.fx .pv { position: relative; background: var(--card); border-radius: var(--r-surface); padding: 24px 26px; display: grid; gap: 16px; box-shadow: inset 0 0 0 1.5px var(--pr); }
.fx .pv-row { display: grid; grid-template-columns: 230px 64px minmax(0, 1fr); gap: 16px; align-items: center; padding: 10px 0; }

.fx .carry { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 28px; }
.fx .tl-after { position: absolute; right: 0; top: 0; font-size: 11.5px; color: var(--mu); transform: translateY(-1px); }
.fx .rv-wait { display: flex; gap: 10px; padding: 0 32px 16px 36px; flex-wrap: wrap; }
.fx .rv-wait .inl { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; }
.fx .filt-0 { opacity: 0.45; }
.fx .fold-h { cursor: pointer; }


/* ================= 3d: the goal surface and Performance across Fusion ================= */
/* tabs carry an icon (I1) */
.fx .tabs { display: flex; gap: 4px; }
.fx .tab { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 99px; color: var(--mu); font-weight: 500; cursor: default; }

/* the plan as one bar, segments by weight */
.fx .plan-bar { display: flex; gap: 3px; height: 14px; }
.fx .plan-seg { position: relative; height: 100%; border-radius: 4px; background: var(--inlay); overflow: hidden; cursor: pointer; }

.fx .plan-seg i { position: absolute; inset: 0 auto 0 0; transition: width 0.7s cubic-bezier(.2,.7,.2,1); }
.fx .plan-lab { display: flex; gap: 3px; }

.fx .plan-lab b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* goals on the year: one lane each */
.fx .lanes { display: grid; }
.fx .lane { display: grid; grid-template-columns: 320px minmax(0, 1fr) 150px; gap: 26px; align-items: center; padding: 16px 14px; margin: 0 -14px; border-radius: var(--r-inset); cursor: pointer; }

.fx .lane-r { display: grid; justify-items: end; gap: 3px; text-align: right; }
.fx .axis { display: grid; grid-template-columns: 320px minmax(0, 1fr) 150px; gap: 26px; padding: 0 0 2px; }
.fx .axis-m { position: relative; height: 18px; }
.fx .axis-m span { position: absolute; font-size: 11.5px; color: var(--mu); transform: translateX(-50%); white-space: nowrap; }
.fx .axis-m .now { color: var(--page); background: var(--f); font-weight: 600; padding: 1px 8px; border-radius: 99px; top: -2px; z-index: 1; }
/* a goal's chart (lane and panel share the drawing) */
.fx .lc { position: relative; height: 64px; }
.fx .lc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fx .lc .fut { position: absolute; top: -4px; bottom: -4px; right: 0; background: color-mix(in oklab, var(--f) 2.5%, transparent); border-radius: 0 10px 10px 0; }
.fx .lc .base { position: absolute; left: 0; right: 0; bottom: 8%; height: 1px; background: var(--hl); }

.fx .lc .pt { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--c, var(--f)); box-shadow: 0 0 0 2px var(--card); }
.fx .sheet .lc .pt { box-shadow: 0 0 0 2px var(--pop); }
.fx .lc .pt.big { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
.fx .lc .pt.first { background: var(--card); box-shadow: inset 0 0 0 2px var(--mu); }
.fx .lc .exp { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--mu); background: transparent; }
.fx .lc .val { position: absolute; transform: translate(-50%, -175%); font-size: 12.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fx .lc .ms { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 4px; transform: rotate(45deg); background: var(--card); box-shadow: inset 0 0 0 2px var(--mu); }
.fx .lc .ms.done { background: var(--ok); box-shadow: 0 0 0 2px var(--card); }
.fx .lc .ms.late { box-shadow: inset 0 0 0 2px var(--no); background: color-mix(in oklab, var(--no) 18%, var(--card)); }
.fx .sheet .lc .ms { background: var(--pop); } .fx .sheet .lc .ms.done { background: var(--ok); box-shadow: 0 0 0 2px var(--pop); }
.fx .lc .ms-l { position: absolute; top: calc(50% + 14px); transform: translateX(-50%); font-size: 11.5px; color: var(--mu); white-space: nowrap; }
.fx .lc .ms-l.late { color: var(--no); font-weight: 600; }
.fx .lc .ms-l { z-index: 2; background: var(--card); padding: 0 6px; border-radius: 6px; } .fx .sheet .lc .ms-l { background: var(--pop); }
.fx .lc .mtrack { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--inlay); border-radius: 2px; }
.fx .lc .mtrack i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 2px; }
.fx .lc.gh-c { border-radius: 12px; box-shadow: inset 0 0 0 1.5px dashed var(--hl); }
.fx [data-tip] { position: relative; }
.fx [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--f); color: var(--page); font: 500 12.5px/1.35 var(--sans); padding: 6px 10px; border-radius: 9px; white-space: nowrap; z-index: 8; pointer-events: none; }
/* the goal panel (B-413) */
.fx .sheet.gp { width: 620px; }
.fx .chain { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; font-size: 13px; color: var(--mu); min-width: 0; flex: 1; }
.fx .chain .lk, .fx .chain .slot { min-width: 0; flex: 0 1 auto; white-space: nowrap; }
.fx .chain .lk { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 4px 4px; border-radius: 99px; background: var(--inlay); color: var(--f); cursor: pointer; max-width: 340px; }

.fx .chain .slot { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--hl); color: var(--mu); }
.fx .gp-title { font-family: var(--serif); font-weight: 500; font-size: 28px; line-height: 1.2; letter-spacing: -0.005em; outline: none; border-radius: 8px; }

.fx .gp-title:focus { box-shadow: 0 0 0 6px color-mix(in oklab, var(--pr) 14%, transparent); background: color-mix(in oklab, var(--pr) 14%, transparent); }
.fx .gp-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--mu); }
.fx .gp-meta b { color: var(--f); font-weight: 500; }
.fx .hero { display: grid; gap: 14px; }
.fx .hero-h { display: flex; align-items: flex-end; gap: 14px; }
.fx .fig { font-size: 40px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; font-variant-numeric: tabular-nums; }
.fx .fig small { font-size: 15px; font-weight: 500; color: var(--mu); letter-spacing: 0; margin-left: 6px; }
.fx .hero .lc { height: 168px; }
.fx .yl { position: absolute; left: -2px; font-size: 11.5px; color: var(--mu); transform: translate(-100%, -50%); padding-right: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fx .hero-chart { padding-left: 46px; }
.fx .months { position: relative; height: 16px; margin-top: 8px; }
.fx .months span { position: absolute; font-size: 11px; color: var(--mu); transform: translateX(-50%); }
.fx .rail { position: relative; height: 12px; border-radius: 99px; background: var(--inlay); }
.fx .rail > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width 0.7s cubic-bezier(.2,.7,.2,1); }
.fx .rail .tick { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--f); border-radius: 2px; }
.fx .rail-l { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mu); margin-top: 10px; }
.fx .story { display: grid; }
.fx .st { display: grid; grid-template-columns: 74px 18px minmax(0, 1fr); gap: 0 12px; padding-bottom: 16px; position: relative; }
.fx .st .d { font-size: 12.5px; color: var(--mu); padding-top: 1px; text-align: right; font-variant-numeric: tabular-nums; }
.fx .st .n { position: relative; display: grid; justify-items: center; }
.fx .st .n::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--mu)); margin-top: 5px; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--pop); }

.fx .st .b { display: grid; gap: 4px; min-width: 0; }
.fx .st .v { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.fx .delta { font-size: 12.5px; font-weight: 600; color: var(--ok); font-variant-numeric: tabular-nums; }
.fx .st.gh .d, .fx .st.gh .b { opacity: 0.55; }
.fx .gp-sec { display: grid; gap: 12px; }
.fx .gp-sec-h { display: flex; align-items: baseline; gap: 10px; }

.fx .unit-r { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 70px; gap: 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-radius: 12px; }

.fx .unit-r .lc { height: 34px; }
.fx .ai-box { display: grid; gap: 10px; padding: 16px 18px; border-radius: var(--r-inset); background: color-mix(in oklab, var(--ai) 8%, var(--pop)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ai) 22%, transparent); }
.fx .ai-box .t-words { font-size: 17px; line-height: 1.35; }
.fx .gh-frame { position: relative; border-radius: var(--r-inset); box-shadow: inset 0 0 0 1.5px var(--hl); padding: 14px; }
.fx .gh-frame .lc { opacity: 0.45; }
/* lists of people with what's due (Team, Home) */
.fx .who { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 22px; align-items: center; padding: 14px 14px; margin: 0 -14px; border-radius: var(--r-inset); }

.fx .mini { display: flex; gap: 3px; height: 8px; }

.fx .due-r { display: flex; align-items: center; justify-content: flex-end; gap: 10px; text-align: right; }
.fx .done-w { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; font-size: 13px; }

/* the team band (D-27) and the person band (D-01) */
.fx .band { background: var(--card); border-radius: var(--r-surface); padding: 24px 28px 0; display: grid; gap: 18px; }
.fx .band-tabs { display: flex; gap: 2px; margin: 0 -6px; }

.fx .tree { display: grid; justify-items: center; gap: 0; }

.fx .tkids { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 100%; position: relative; padding-top: 26px; }
.fx .tkids::before { content: ""; position: absolute; top: 0; left: 12.5%; right: 12.5%; height: 13px; border: 1.5px solid var(--hl); border-bottom: 0; border-radius: 12px 12px 0 0; }

.fx .p-rail { display: grid; gap: 0; align-content: start; }
.fx .p-rail > div { padding: 14px 0; display: grid; gap: 6px; }

/* Home: Needs you, acting in place */
.fx .need { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 18px; border-radius: var(--r-inset); }

.fx .slots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.fx .slots button { border: 0; background: var(--inlay); color: var(--f); border-radius: 10px; padding: 6px 11px; font: 500 13px var(--sans); cursor: pointer; }
.fx .slots button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--pr); background: color-mix(in oklab, var(--pr) 12%, var(--inlay)); }
.fx .need.gone { opacity: 0.55; }

function timeline(today, phases = PHASES, o = {}) {
  const ph = phases.findIndex((p) => today >= p.s && today < p.e);
  const segs = phases.map((p, i) => {
    const w = days(p.s, p.e) / span * 100;
    const fill = o.ghost ? 0 : today >= p.e ? 100 : today <= p.s ? 0 : days(p.s, today) / days(p.s, p.e) * 100;
    return `<div class="tl-seg ${!o.ghost && i === ph ? "on" : ""} ${o.ghost ? "gh" : ""}" data-tw="seg${i}" style="width:calc(${w}% - 2px)"><i data-tw="segi${i}" style="width:${fill}%"></i></div>`;
  }).join("");
  if (o.thin) return `<div class="tl thin"><div class="tl-track">${segs}</div></div>`;
  const labels = phases.map((p, i) => {
    const end = i === phases.length - 1;
    if (!end && i !== ph && pos(phases[i + 1].s) - pos(p.s) < 0.07) return "";
    return `<span class="tl-ph ${!o.ghost && i === ph ? "on" : ""} ${end ? "end" : ""}" style="left:${end ? 100 : pos(p.s) * 100}%">${p.n}</span>`;
  }).join("");
  const months = [];
  for (let m = 0; m < 12; m++) { const d = new Date(Date.UTC(2026, 4 + m, 1)); const s = d.toISOString().slice(0, 10); months.push(`<span style="left:${pos(s) * 100}%">${fmt(s, { month: "short" })}${m === 8 ? ` ${o.y2 || "2027"}` : ""}</span>`); }
  const t = o.ghost ? "" : `<div class="tl-today" data-tw="today" style="left:${pos(today) * 100}%;--tx:${pos(today) < 0.05 ? "-14px" : pos(today) > 0.95 ? "calc(-100% + 14px)" : "-50%"}"><span>Today ${dm(today)}</span></div>`;
  return `<div class="tl ${o.ghost ? "tl-gh" : ""}"><div class="tl-phases">${labels}</div>
    <div class="tl-track">${segs}${o.ghost ? "" : MILESTONES.map((d) => `<span class="tl-ms" style="left:${pos(d) * 100}%" title="${dm(d)}"></span>`).join("")}</div>${t}
    <div class="tl-months">${months.join("")}</div></div>`;
}

  const segs = phases.map((ph, i) => `<div class="yb-seg ${o.ghost ? "" : i === 0 ? "p0" : ""}" style="width:calc(${p(ph.e) - p(ph.s)}% - 3px)" title="${ph.n}, ${dm(ph.s)} to ${dm(ph.e)}">${p(ph.e) - p(ph.s) >= 8 ? ph.n : ""}</div>`).join("");
  const handles = o.drag ? phases.slice(0, -1).map((ph, i) => `<span class="yb-h" data-h="${i}" style="left:${p(ph.e)}%" role="slider" aria-label="${ph.n} ends" aria-valuetext="${dm(ph.e)}" tabindex="0"></span>`).join("") : "";
  const all = [phases[0].s, ...phases.map((ph) => ph.e)];
  const dates = all.map((d, i, a) => (i > 0 && i < a.length - 1 && (p(d) - p(a[i - 1]) < 9 || p(a[a.length - 1]) - p(d) < 9) && o.on !== i) ? "" : `<span style="left:${p(d)}%;${i === 0 ? "transform:none" : i === a.length - 1 ? "transform:translateX(-100%)" : ""}" class="${o.on === i ? "on" : ""}">${fmt(d, { day: "numeric", month: "short", ...(i === 0 || i === a.length - 1 ? { year: "numeric" } : {}) })}</span>`).join("");
  return `<div class="yb ${o.ghost ? "yb-gh" : ""}" id="${o.id || ""}"><div class="yb-track">${segs}${handles}</div><div class="yb-d">${dates}</div></div>`;
}

function onMove(e) {

  const f = Math.max(0, Math.min(1, (e.clientX - drag.r.left) / drag.r.width));
  let d = new Date(D(s).getTime() + Math.round(f * sp) * 864e5).toISOString().slice(0, 10);
  const lo = ph[drag.i].s, hi = ph[drag.i + 1].e;
  if (days(lo, d) < 7) d = new Date(D(lo).getTime() + 7 * 864e5).toISOString().slice(0, 10);
  if (days(d, hi) < 7) d = new Date(D(hi).getTime() - 7 * 864e5).toISOString().slice(0, 10);
  if (d === ph[drag.i].e) return;

  .fx .yrule span::before { content: ""; position: absolute; left: 0; bottom: 0; height: 9px; width: 1px; background: var(--hl); }
  .fx .yrule b { color: var(--f); font-weight: 600; margin-left: 3px; }
  .fx .ytrack { position: relative; display: flex; gap: 2px; }
  .fx .yseg { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 12px; overflow: hidden; white-space: nowrap; line-height: 1.25; font-size: 13px; font-weight: 600; }
  .fx .yseg small { font-size: 11.5px; font-weight: 500; color: var(--mu); }
  .fx .yseg:first-child { border-radius: 6px 0 0 6px; } .fx .yseg:last-of-type { border-radius: 0 6px 6px 0; }
  .fx .yedge { position: absolute; top: -5px; bottom: -5px; width: 14px; margin-left: -7px; cursor: ew-resize; display: grid; place-items: center; touch-action: none; z-index: 2; }
  .fx .yedge::before { content: ""; width: 3px; height: 100%; border-radius: 2px; background: var(--f); box-shadow: 0 0 0 2px var(--card); }
  .fx .yedge:hover::before, .fx .yedge.on::before { background: var(--pr); }
  .fx .yhol { position: relative; height: 10px; }
  .fx .yhol i { position: absolute; top: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: color-mix(in oklab, var(--mu) 80%, transparent); }
  .fx .yghost { position: relative; height: 4px; margin-top: 2px; }
  .fx .yghost i { position: absolute; top: 0; bottom: 0; background: var(--hl); border-radius: 1px; }
  .fx .ymarks { position: relative; }
  .fx .ymark { position: absolute; top: 0; display: flex; flex-direction: column; gap: 2px; padding-top: calc(var(--lv) * 38px); }
  .fx .ymark::before { z-index: 0; content: ""; position: absolute; top: -6px; height: calc(var(--lv) * 38px + 8px); left: 0; width: 1.5px; background: color-mix(in oklab, var(--f) 45%, transparent); }
  .fx .ymark.r { align-items: flex-end; transform: translateX(-100%); } .fx .ymark.r::before { left: auto; right: 0; }
  .fx .ymark button { all: unset; position: relative; z-index: 1; background: var(--card); cursor: pointer; display: grid; gap: 1px; padding: 3px 7px 4px; border-radius: 8px; white-space: nowrap; touch-action: none; }
  .fx .ymark button:hover, .fx .ymark button.on { background: var(--inlay); }
  .fx .ymark button:focus-visible { box-shadow: inset 0 0 0 1.5px var(--pr); }
  .fx .ymark .n { font-size: 12px; color: var(--mu); }
  .fx .ymark .d { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; gap: 5px; align-items: center; }
  .fx .ymark.warn .d, .fx .ychip.warn { color: var(--wa); }
  .fx .ypop { position: absolute; z-index: 6; width: 268px; background: var(--pop); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 1px var(--hl); padding: 12px; display: grid; gap: 10px; }
  .fx .ypop .t { font-size: 12.5px; color: var(--mu); }
  .fx .ypop .big { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fx .ypop .row2 { display: flex; gap: 6px; }
  .fx .ypop .row2 button { flex: 1; height: 30px; border: 0; border-radius: 10px; background: var(--inlay); color: var(--f); font: 500 12.5px var(--sans); cursor: pointer; }
  .fx .ypop .row2 button:hover { background: color-mix(in oklab, var(--f) 10%, var(--inlay)); }
  .fx .ypop .why { font-size: 12.5px; color: var(--wa); display: flex; gap: 6px; align-items: center; }
  .fx .ywarn { display: flex; gap: 12px; align-items: center; background: var(--inlay); border-radius: var(--r-inset); padding: 9px 12px 9px 14px; font-size: 13.5px; }
  .fx .ysent { font-size: 17px; line-height: 2.15; max-width: 980px; color: var(--mu); }
  .fx .ysent b { color: var(--f); font-weight: 600; }
  .fx .ychip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 8px; background: var(--inlay); color: var(--f); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.6; position: relative; }
  .fx .ychip:hover, .fx .ychip.on { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--pr) 70%, transparent); }
  .fx .ychip:focus-visible { box-shadow: inset 0 0 0 1.5px var(--pr); }
  .fx .ychip .ic { --s: 14px; }
  .fx .ystrip { display: flex; gap: 2px; height: 10px; }
  .fx .ystrip i { border-radius: 2px; }
  .fx .yline { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--mu); }
  .fx .yline > span { display: inline-flex; gap: 7px; align-items: center; }
  .fx .yflag { position: absolute; top: -4px; bottom: -4px; width: 0; z-index: 1; }
  .fx .yflag::before { content: ""; position: absolute; top: 0; bottom: 0; left: -0.75px; width: 1.5px; background: color-mix(in oklab, var(--f) 65%, transparent); }
  .fx .yflag i { position: absolute; top: -7px; left: -4px; width: 8px; height: 8px; transform: rotate(45deg); border-radius: 1.5px; background: var(--f); cursor: ew-resize; touch-action: none; }
  .fx .yflag.warn::before, .fx .yflag.warn i { background: var(--wa); }
  `;
  document.head.append(css);

  const add = (d, n) => new Date(D(d).getTime() + n * 864e5).toISOString().slice(0, 10);
  const holi = (d) => HOLI.find(([h]) => h === d);
  const off = (d) => [0, 6].includes(wday(d)) || !!holi(d);
  const nextWork = (d) => { let x = d; for (let i = 0; i < 14 && off(x); i++) x = add(x, 1); return x; };
  const ph = () => (ui.ph ||= PH0());
  const msOf = () => (ui.ms ||= MOM0());
  // Every dated moment of the year, in order: three are the steps' edges, three are moments within them.
  const MOMENTS = () => {
    const p = ph(), ms = msOf(), m = (n) => ms.find((x) => x.n === n)?.d;
    return [
      { k: "goals", n: "Goals agreed", d: p[0].e, edge: 0 },
      { k: "mid", n: "Mid-year check-in", d: m("Mid-year check-in") },
      { k: "open", n: "Reviews open", d: p[1].e, edge: 1 },
      { k: "self", n: "Self-reviews due", d: m("Self-reviews due") },
      { k: "cal", n: "Calibration", d: m("Calibration") },
      { k: "out", n: "Results out", d: p[2].e, edge: 2 },
    ];
  };
  const setDate = (k, d) => {
    const p = ph(), ms = msOf(), s = p[0].s, e = p[3].e;
    const mo = MOMENTS().find((x) => x.k === k); if (!mo) return;
    if (mo.edge != null) {
      const i = mo.edge, lo = add(p[i].s, 7), hi = add(p[i + 1].e, -7);
      d = d < lo ? lo : d > hi ? hi : d; p[i].e = d; p[i + 1].s = d;
    } else {
      d = d < s ? s : d > e ? e : d; const x = ms.find((y) => y.n === mo.n); if (x) x.d = d;
    }
  };
  const span = () => days(ph()[0].s, ph()[3].e);
  const pos = (d) => Math.max(0, Math.min(100, days(ph()[0].s, d) / span() * 100));
  const TONE = ["yc-s0", "yc-s1", "yc-s2", "yc-s3"];

  const months = () => {
    const out = [], s = ph()[0].s, e = ph()[3].e;
    let y = +s.slice(0, 4), mo = +s.slice(5, 7);
    for (let i = 0; i < 13; i++) { mo++; if (mo > 12) { mo = 1; y++; } const iso = `${y}-${String(mo).padStart(2, "0")}-01`; if (iso >= e) break; out.push(iso); }
    return out;
  };
  const rule = () => `<div class="yrule" aria-hidden="true">${months().map((m) => `<span style="left:${pos(m)}%">${fmt(m, { month: "short" })}${m.slice(5, 7) === "01" ? `<b>${m.slice(0, 4)}</b>` : ""}</span>`).join("")}</div>`;
  const holis = () => `<div class="yhol" aria-hidden="true">${HOLI.filter(([d]) => d > ph()[0].s && d < ph()[3].e).map(([d, n]) => `<i style="left:${pos(d)}%" title="${n}, ${day(d)}"></i>`).join("")}</div>`;
  const ghost = () => `<div class="yghost" aria-hidden="true">${PHASES.map((x) => { const a = pos(add(x.s, 366)), b = pos(add(x.e, 366)); return `<i style="left:${a}%;width:calc(${b - a}% - 2px)"></i>`; }).join("")}</div>`;
  const track = (h, edges = true, flags = false) => {
    const p = ph();
    const segs = p.map((x, i) => { const w = pos(x.e) - pos(x.s); return `<div class="yseg ${TONE[i]}" style="width:calc(${w}% - 2px)">${w > 7 ? `<span>${x.n}</span><small>${days(x.s, x.e)} days</small>` : ""}</div>`; }).join("");
    const eds = edges ? p.slice(0, -1).map((x, i) => `<span class="yedge ${ui.ydrag?.edge === i ? "on" : ""}" data-ydrag="${["goals", "open", "out"][i]}" role="slider" tabindex="0" aria-label="${x.n} ends" aria-valuetext="${day(x.e)}" style="left:${pos(x.e)}%"></span>`).join("") : "";
    const fl = flags ? MOMENTS().filter((m) => m.edge == null).map((m) => `<span class="yflag ${off(m.d) ? "warn" : ""}" style="left:${pos(m.d)}%"><i data-ydrag="${m.k}" title="${m.n}, ${day(m.d)}"></i></span>`).join("") : "";
    return `<div class="ytrack" id="ytrack" style="height:${h}px">${segs}${eds}${fl}</div>`;
  };
  const pop = () => {
    const m = MOMENTS().find((x) => x.k === ui.ypop); if (!m) return "";
    const h = holi(m.d), we = [0, 6].includes(wday(m.d));
    const to = nextWork(m.d);
    const left = Math.min(Math.max(pos(m.d), 12), 88);
    return `<div class="ypop" style="left:calc(${left}% - 134px);top:${ui.ypopTop ?? 0}px" role="dialog" aria-label="${m.n}">
      <span class="t">${m.n}</span><span class="big">${day(m.d)} ${m.d.slice(0, 4)}</span>
      <div class="row2"><button data-yact="step" data-k="${m.k}" data-v="-7">− week</button><button data-yact="step" data-k="${m.k}" data-v="-1">− day</button><button data-yact="step" data-k="${m.k}" data-v="1">+ day</button><button data-yact="step" data-k="${m.k}" data-v="7">+ week</button></div>
      ${off(m.d) ? `<span class="why">${ic("alert", 14)}${we ? `A ${fmt(m.d, { weekday: "long" })}` : ""}${we && h ? "; " : ""}${h ? `${h[1]}` : ""}</span><div class="row2"><button data-yact="set" data-k="${m.k}" data-v="${to}">Move to ${day(to)}</button></div>` : ""}
    </div>`;
  };
  const warnRow = () => {
    const bad = MOMENTS().filter((m) => off(m.d))[0]; if (!bad) return "";
    const to = nextWork(bad.d), h = HOLI.find(([d]) => d >= bad.d && d <= to);
    return `<div class="ywarn rise">${ic("alert", 17)}<span><b style="font-weight:600">${bad.n} falls on ${day(bad.d)}</b>${h ? `<span class="mu">, and ${dm(h[0])} is ${h[1]}</span>` : ""}</span><button class="btn sm" style="margin-left:auto" data-yact="set" data-k="${bad.k}" data-v="${to}">Move to ${day(to)}</button></div>`;
  };
  const legend = (more = "") => `<div class="ylegend"><span class="row" style="gap:6px"><span class="k-hol"></span>Public holidays</span><span class="row" style="gap:6px"><i style="width:14px;height:4px;border-radius:1px;background:var(--hl);display:inline-block"></i>FY2027, a year on</span>${more}</div>`;
  const chip = (m) => `<button class="ychip ${off(m.d) ? "warn" : ""} ${ui.ypop === m.k ? "on" : ""}" data-yact="pop" data-k="${m.k}" aria-label="${m.n}, ${day(m.d)}">${off(m.d) ? ic("alert") : ""}${day(m.d)}</button>`;

  // a: the year itself is the editor; dates hang under it and open on click.
  const editorA = () => {
    const W = 1040, lanes = [[], [], [], [], []];
    const placed = MOMENTS().map((m) => {
      const x = pos(m.d) / 100 * W, w = Math.max(m.n.length * 6.8, 78) + 20, right = pos(m.d) > 70;
      const L = right ? x - w : x, R = L + w;
      let lv = 0; while (lv < 4 && lanes[lv].some(([a, b]) => L < b + 8 && R > a - 8)) lv++; lanes[lv].push([L, R]);
      return { ...m, lv, right };
    });
    ui.ypopTop = 0;
    const marks = placed.map((m) => `<div class="ymark ${m.right ? "r" : ""} ${off(m.d) ? "warn" : ""}" style="left:${pos(m.d)}%;--lv:${m.lv}"><button class="${ui.ypop === m.k ? "on" : ""}" data-yact="pop" data-k="${m.k}" ${m.edge == null ? `data-ydrag="${m.k}"` : ""}><span class="n">${m.n}</span><span class="d">${off(m.d) ? ic("alert", 13) : ""}${day(m.d)}</span></button></div>`).join("");
    ui.ypopTop = 64 + Math.max(...placed.map((m) => m.lv)) * 38;
    return `${legend()}<div style="display:grid;gap:4px">${rule()}${track(52)}${holis()}${ghost()}</div>
      <div class="ymarks" style="height:${56 + Math.max(...placed.map((m) => m.lv)) * 38}px">${marks}${pop()}</div>${warnRow()}`;
  };

  // b: the dates read as a sentence; Fusion proposed them, a click changes one.
  const editorB = () => {
    const M = Object.fromEntries(MOMENTS().map((m) => [m.k, m])), p = ph();
    ui.ypopTop = 118;
    return `<div class="row" style="align-items:center;gap:14px"><span class="sm mu">Proposed from FY2027's dates, a year on</span></div>
      <div class="ystrip" aria-hidden="true">${p.map((x, i) => `<i class="${TONE[i]}" style="width:${pos(x.e) - pos(x.s)}%"></i>`).join("")}</div>
      <div style="position:relative">
        <p class="ysent" style="margin:0"><b>Planning</b> runs from ${day(p[0].s)} until ${chip(M.goals)}, when goals are agreed.
        <b>Execution</b> follows, with a mid-year check-in on ${chip(M.mid)}.
        <b>Reviews</b> open ${chip(M.open)}: self-reviews due ${chip(M.self)}, calibration ${chip(M.cal)}, and <b>results out</b> ${chip(M.out)}.
        Everyone is told when you launch.</p>
        ${pop()}
      </div>${warnRow()}`;
  };

  // c: the four steps on the year with the moments as flags on it; the six dates in one line under it.
  const editorC = () => {
    const M = MOMENTS();
    ui.ypopTop = 30;
    return `${legend()}<div style="display:grid;gap:4px">${rule()}${track(40, true, true)}${holis()}${ghost()}</div>
      <div style="position:relative"><div class="yline">${M.map((m) => `<span>${m.n} ${chip(m)}</span>`).join("")}</div>${pop()}</div>${warnRow()}`;
  };

  const orig = setupScreen;
  PAGES.setup = () => {
    const base = orig();
    const cards = base.main.slice(base.main.indexOf('<div class="g3">'));
    const v = A("year"), p = ph();
    const head = `<div class="yh"><div class="col"><h1 class="t-page" style="margin:0">Set up <span class="yn" id="yn" contenteditable="true" spellcheck="false" role="textbox" aria-label="The year's name">${esc(ui.name)}</span></h1><span class="mu">${fullDate(p[0].s)} to ${fullDate(p[3].e)}</span></div>
      <div class="row" style="margin-left:auto"><button class="btn g" data-act="toast" data-msg="Kept as a draft; nobody is told">Keep as a draft</button><button class="btn p" data-act="launch">${ic("rocket", 16)}Launch ${esc(ui.name)}</button></div></div>`;
    const sec = `<section class="ysec">${v === "b" ? editorB() : v === "c" ? editorC() : editorA()}</section>`;
    return { ...base, crumbs: ["Performance", "Year", `Set up ${esc(ui.name)}`], main: `<div class="scroll"><div class="pg" style="gap:18px;max-width:1160px">${head}${sec}${cards}</div></div>` };
  };

  // Clicks on dates, the popover's steps and moves.
  fxEl.addEventListener("click", (e) => {
    const t = e.target.closest("[data-yact]");
    if (!t) { if (ui.ypop && !e.target.closest(".ypop")) { ui.ypop = null; renderFrame(); } return; }
    e.stopImmediatePropagation();
    const a = t.dataset.yact, k = t.dataset.k;
    if (ui.ymoved) { ui.ymoved = false; return; }
    if (a === "pop") ui.ypop = ui.ypop === k ? null : k;
    else if (a === "step") { const m = MOMENTS().find((x) => x.k === k); setDate(k, add(m.d, +t.dataset.v)); }
    else if (a === "set") { setDate(k, t.dataset.v); toast(`${MOMENTS().find((x) => x.k === k).n} moved to ${day(t.dataset.v)}`); }
    renderFrame();
  }, true);
  // Dragging an edge or a moment along the year.
  fxEl.addEventListener("pointerdown", (e) => {
    const h = e.target.closest("[data-ydrag]"); if (!h) return;
    ui.ydrag = { k: h.dataset.ydrag, x: e.clientX, moved: false };
    e.preventDefault();
  });
  addEventListener("pointermove", (e) => {
    const d = ui.ydrag; if (!d) return;
    if (!d.moved && Math.abs(e.clientX - d.x) < 3) return;
    d.moved = true;
    const tr = document.getElementById("ytrack"); if (!tr) return;
    const r = tr.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    setDate(d.k, add(ph()[0].s, Math.round(f * span())));
    ui.ypop = null; renderFrame();
  });
  addEventListener("pointerup", () => {
    const d = ui.ydrag; if (!d) return; ui.ydrag = null;
    if (d.moved) { ui.ymoved = true; setTimeout(() => { ui.ymoved = false; }, 0); renderFrame(); }
  });
  fxEl.addEventListener("keydown", (e) => {
    const h = e.target.closest?.(".yedge"); if (!h) return;
    const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!step) return;
    const m = MOMENTS().find((x) => x.k === h.dataset.ydrag); setDate(m.k, add(m.d, step)); e.preventDefault(); renderFrame();
    document.querySelector(`.yedge[data-ydrag="${m.k}"]`)?.focus();
  });
  fxEl.addEventListener("focusout", (e) => { if (e.target.id === "yn") { ui.name = e.target.textContent.trim() || "FY2028"; renderFrame(); } });
  fxEl.addEventListener("keydown", (e) => { if (e.target.id === "yn" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
})();

try { const t = localStorage.getItem(KEY + "-t"); if (t === "light" || t === "dark") ui.theme = t; } catch {}
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { document.getElementById("saved").textContent = "Saved in this browser"; return; }
  document.getElementById("saved").textContent = "Saved";
  db.doc("setup/main").onSnapshot((snap) => {
    if (!snap.exists || dirty || writing || snap.metadata?.hasPendingWrites) return;
    if (document.activeElement?.id === "note") return;
    const data = JSON.parse(JSON.stringify(snap.data() || {})); // snapshots are frozen
    state = { ...blank(), answers: { ...blank().answers, ...(data.answers || {}) }, note: data.note || "" };
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    render();
  }, () => {});
})();
</script>
